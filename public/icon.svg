<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2616" />
      <stop offset="100%" stop-color="#1E140B" />
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C25A2B" />
      <stop offset="50%" stop-color="#A1431B" />
      <stop offset="100%" stop-color="#732C0E" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#843E1F" stroke-width="6" stroke-dasharray="10 14" opacity="0.4" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#D97706" stroke-width="2" opacity="0.3" />

  <!-- Radiating Sunlight Rays -->
  <g stroke="#D97706" stroke-width="3" opacity="0.25" stroke-linecap="round">
    <line x1="256" y1="65" x2="256" y2="85" />
    <line x1="256" y1="427" x2="256" y2="447" />
    <line x1="65" y1="256" x2="85" y2="256" />
    <line x1="427" y1="256" x2="447" y2="256" />
    <line x1="121" y1="121" x2="135" y2="135" />
    <line x1="391" y1="391" x2="377" y2="377" />
    <line x1="121" y1="391" x2="135" y2="377" />
    <line x1="391" y1="121" x2="377" y2="135" />
  </g>

  <!-- Terracotta Unglazed Clay Kulhar (Vessel of Earth) -->
  <g transform="translate(0, 20)">
    <!-- Base Plate Rim -->
    <ellipse cx="256" cy="400" rx="90" ry="16" fill="#170F08" opacity="0.5" />
    
    <!-- Kulhar Body -->
    <path d="M165 210 L195 385 C197 398 208 408 221 408 L291 408 C304 408 315 398 317 385 L347 210 Z" fill="url(#terracottaGrad)" stroke="#E88256" stroke-width="3" />
    
    <!-- Earthen Ribs / Traditional Wheel Grooves -->
    <path d="M172 250 Q256 270 340 250" fill="none" stroke="#E88256" stroke-width="4" opacity="0.7" />
    <path d="M179 290 Q256 310 333 290" fill="none" stroke="#E88256" stroke-width="4" opacity="0.7" />
    <path d="M187 335 Q256 352 325 335" fill="none" stroke="#E88256" stroke-width="3.5" opacity="0.6" />
    
    <!-- Kulhar Rim (Mouth of Clay) -->
    <ellipse cx="256" cy="210" rx="91" ry="24" fill="#843E1F" stroke="#E88256" stroke-width="3" />
    <ellipse cx="256" cy="210" rx="78" ry="18" fill="#52200B" />
    
    <!-- Sacred Living Sprout Emerging from Soil -->
    <!-- Stem -->
    <path d="M256 210 Q252 140 236 100" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" />
    
    <!-- Left Leaf -->
    <path d="M246 150 C210 145 180 170 190 195 C220 200 240 175 246 150 Z" fill="url(#leafGrad)" stroke="#A7F3D0" stroke-width="2" />
    
    <!-- Right Leaf -->
    <path d="M240 120 C275 105 310 125 305 155 C275 165 250 140 240 120 Z" fill="url(#leafGrad)" stroke="#A7F3D0" stroke-width="2" />
    
    <!-- Budding Top Sprout -->
    <path d="M236 100 C230 75 248 65 256 65 C264 65 282 75 276 100 C266 110 246 110 236 100 Z" fill="url(#leafGrad)" />
    
    <!-- Golden Seed of Life / Aura Sparkle -->
    <circle cx="256" cy="62" r="5" fill="url(#goldGrad)" />
  </g>

  <!-- Typography / Brand Glyph -->
  <text x="256" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" fill="#E6D5C3" letter-spacing="6">MRITTIKA</text>
</svg>
